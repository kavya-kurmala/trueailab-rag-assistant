<!DOCTYPE html>
<html>
<head>
    <title>TRUEAILAB RAG Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <h1>TRUEAILAB RAG Assistant</h1>
        <p class="subtitle">Ask questions from the knowledge base</p>

        <div id="chatBox" class="chat-box"></div>

        <div id="loading" class="loading">Assistant is thinking...</div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Ask your question..." />
            <button onclick="sendMessage()">Send</button>
        </div>

        <button class="new-chat" onclick="newChat()">New Chat</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
